name: Inspect BBC weekly quiz (temporary)
on:
  workflow_dispatch:
    inputs:
      target:
        required: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: scripts
        run: npm install --no-audit --no-fund
      - working-directory: scripts
        run: |
          cat > inspect.mjs <<'JS'
          import { describePage } from './describe-page.mjs';
          import { findQuizEmbeds } from './joe-parser.mjs';
          const H = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36', Accept: 'text/html,*/*', 'Accept-Language': 'en-GB,en;q=0.9' };
          const get = async (u) => { const r = await fetch(u, { headers: H, redirect: 'follow', signal: AbortSignal.timeout(30000) }); const t = await r.text(); console.log(`----- ${u} -> ${r.status} ${r.url} ${t.length}b`); return t; };
          const topic = await get('https://www.bbc.co.uk/news/topics/crxd18199v9t');
          const arts = [...new Set([...topic.matchAll(/href="(\/news\/articles\/[a-z0-9]+)"/g)].map((m) => m[1]))].slice(0, 3);
          console.log('Articles (topic order):', arts);
          for (const a of arts.slice(0, 1)) {
            const h = await get('https://www.bbc.co.uk' + a);
            const pub = /"datePublished":"([^"]+)"/.exec(h); console.log('datePublished', pub && pub[1], 'title', /<title>([^<]*)/.exec(h)?.[1]);
            const riddles = [...new Set([...h.matchAll(/https:\/\/www\.riddle\.com\/embed\/a\/[A-Za-z0-9]+/g)].map((m) => m[0]))];
            console.log('Riddles:', riddles);
            for (const r of riddles) {
              const rh = await get(r);
              console.log(describePage(rh).slice(0, 6000));
              for (const k of ['isCorrect', 'correct', '"question', 'answers', 'items', 'blocks']) { let i = rh.indexOf(k), n = 0; while (i >= 0 && n < 3) { console.log(`R[${k}]…`, rh.slice(Math.max(0, i - 300), i + 700)); i = rh.indexOf(k, i + 3000); n++; } }
              for (const m of rh.matchAll(/https?:\/\/[^"'\s]*riddle[^"'\s]*/g)) console.log('RURL:', m[0]);
            }
          }
          JS
          node inspect.mjs
        env:
          TARGET: ${{ inputs.target }}
