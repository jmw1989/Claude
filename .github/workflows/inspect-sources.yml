name: Inspect new quiz sources (temporary)
on:
  workflow_dispatch:
    inputs:
      only:
        required: false
      urls:
        required: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: scripts
        run: npm install --no-audit --no-fund
      - working-directory: scripts
        env:
          ONLY: ${{ inputs.only }}
          URLS: ${{ inputs.urls }}
        run: |
          cat > inspect.mjs <<'JS'
          import { describePage } from './describe-page.mjs';
          import { get } from './fetch-page.mjs';
          import * as cheerio from 'cheerio';
          const series = await get('https://www.theguardian.com/theguardian/series/the-quiz-thomas-eaton');
          const links = [...new Set([...series.html.matchAll(/href="(https:\/\/www\.theguardian\.com\/[a-z-]+\/\d{4}\/[a-z]{3}\/\d{2}\/[^"#?]+)"/g)].map((m) => m[1]))];
          console.log('SERIES links:\n' + links.slice(0, 12).join('\n'));
          const art = await get(links[0]);
          const $ = cheerio.load(art.html);
          console.log('TITLE', $('title').text(), '| published', $('meta[property="article:published_time"]').attr('content'));
          $('[data-gu-name="body"] p, [data-gu-name="body"] h2, article p, article h2').slice(0, 90).each((i, el) => console.log(`${el.tagName}: ${$(el).html().slice(0, 300)}`));
          JS
          node inspect.mjs
