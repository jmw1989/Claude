name: Sample trivia questions (temporary)
on: workflow_dispatch
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for tags in football soccer premier_league world_cup; do
            for i in 1 2; do
              curl -sS "https://the-trivia-api.com/v2/questions?limit=50&categories=sport_and_leisure&tags=$tags" \
                | jq -r --arg t "$tags" '.[] | "\($t) | \(.tags|join(",")) | \(.question.text) => \(.correctAnswer)"'
            done
          done | sort -u
