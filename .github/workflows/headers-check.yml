name: Check BBC framing headers (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.bbc.co.uk/sport/articles/$(jq -r '.quizzes[0].id' <(curl -sS https://raw.githubusercontent.com/jmw1989/Claude/claude/mobile-quiz-app-joe-friday-pm9gaa/data/bbcsport/index.json)) https://www.bbc.co.uk/news/articles/cmx2qpj72znwo; do
            echo "== $u"
            curl -sS -o /dev/null -D - -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' "$u" | grep -iE '^(HTTP|x-frame-options|content-security-policy|location)'
          done
