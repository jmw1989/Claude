name: Check National embed (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="$(curl -sS https://raw.githubusercontent.com/jmw1989/Claude/claude/mobile-quiz-app-joe-friday-pm9gaa/data/national/index.json | jq -r '.quizzes[0].embedUrl')"
          echo "URL: $U"
          for ref in "" "https://jmw1989.github.io/" "https://www.thenationalnews.com/"; do
            echo "===== Referer: '$ref'"
            curl -sS -D /tmp/h -o /tmp/b ${ref:+-H "Referer: $ref"} -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' "$U"
            grep -iE '^(HTTP|x-frame-options|content-security-policy|location)' /tmp/h
            wc -c < /tmp/b
            grep -oiE '.{120}(not (allowed|authori[sz]ed|licen[sc]ed)|allowed ?domains?|whitelist|embed(ding)? (is )?(not|disabled)|domainCheck|referrer).{160}' /tmp/b | head -8
          done
          echo "===== player script references"
          grep -oiE 'src="[^"]+\.js[^"]*"' /tmp/b | head
