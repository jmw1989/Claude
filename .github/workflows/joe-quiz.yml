name: Fetch Friday quizzes

on:
  schedule:
    # JOE and the BBC usually publish on Thursday afternoon or evening (UK time),
    # QuizQuizQuiz and The Week on Friday, the Guardian on Saturday morning and The
    # National on Monday. Check a few times; runs after a quiz is saved finish
    # straight away.
    - cron: '30 19 * * 4'  # Thursday 19:30 UTC
    - cron: '0 7 * * 5'    # Friday 07:00 UTC
    - cron: '0 11 * * 5'   # Friday 11:00 UTC
    - cron: '0 16 * * 5'   # Friday 16:00 UTC
    - cron: '0 10 * * 6'   # Saturday 10:00 UTC
    - cron: '0 12 * * 1'   # Monday 12:00 UTC
  workflow_dispatch:
    inputs:
      url:
        description: 'Optional: a specific JOE quiz page URL to import'
        required: false
      force:
        description: 'Re-import even if this week is already saved'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: joe-quiz
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install script dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Test the parser
        working-directory: scripts
        run: npm test

      - name: Fetch this week's JOE quiz
        id: joe
        continue-on-error: true
        working-directory: scripts
        env:
          QUIZ_URL: ${{ inputs.url }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$QUIZ_URL" ]; then args+=(--url "$QUIZ_URL"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node fetch-joe-quiz.mjs "${args[@]}"

      - name: Fetch this week's QuizQuizQuiz Friday Quiz
        id: qqq
        continue-on-error: true
        working-directory: scripts
        run: node fetch-qqq-quiz.mjs

      - name: Fetch this week's Guardian Saturday quiz
        id: guardian
        continue-on-error: true
        working-directory: scripts
        run: node fetch-guardian-quiz.mjs

      - name: Fetch the latest BBC News, BBC Sport, The Week and The National quizzes
        id: links
        continue-on-error: true
        working-directory: scripts
        run: node fetch-link-quizzes.mjs

      - name: Keep the page for debugging if it couldn't be read
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joe-debug-pages
          path: scripts/debug/
          if-no-files-found: ignore

      - name: Commit the quizzes
        run: |
          git config user.name "quiz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Friday quizzes"
            git push
          fi

      - name: Report a failed fetch
        if: steps.joe.outcome == 'failure' || steps.qqq.outcome == 'failure' || steps.guardian.outcome == 'failure' || steps.links.outcome == 'failure'
        run: |
          echo "::error::JOE: ${{ steps.joe.outcome }}, QuizQuizQuiz: ${{ steps.qqq.outcome }}, Guardian: ${{ steps.guardian.outcome }}, linked quizzes: ${{ steps.links.outcome }}. See the steps above."
          exit 1
