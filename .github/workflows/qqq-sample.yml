name: Inspect quizquizquiz page (temporary)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: scripts
        run: npm install --no-audit --no-fund
      - working-directory: scripts
        run: |
          cat > inspect.mjs <<'JS'
          import { describePage } from './describe-page.mjs';
          import { findQuizEmbeds } from './joe-parser.mjs';
          const H = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36', Accept: 'text/html,*/*', 'Accept-Language': 'en-GB,en;q=0.9' };
          const get = async (u) => (await fetch(`https://r.jina.ai/${u}`, { headers: { ...H, 'X-Return-Format': 'html' }, signal: AbortSignal.timeout(45000) })).text();
          const html = await get('https://quizquizquiz.com/friday/');
          for (const m of html.matchAll(/<form[^>]*>/g)) console.log('FORM:', m[0]);
          for (const m of html.matchAll(/<input[^>]*>/g)) console.log('INPUT:', m[0]);
          const i = html.indexOf('quiz-page');
          console.log('QUIZ HTML:', html.slice(i - 400, i + 6000));
          const raw = async (u) => (await fetch(`https://r.jina.ai/${u}`, { headers: { ...H, 'X-Return-Format': 'text' }, signal: AbortSignal.timeout(45000) })).text();
          const js = await raw('https://quizquizquiz.com/online-quiz/assets/quiz.js?v=932');
          console.log('QUIZ.JS:', js.slice(0, 9000));
          const fq = await get('https://quizquizquiz.com/friday-quiz/');
          console.log('FRIDAY-QUIZ PAGE text:', fq.replace(/<script[\s\S]*?<\/script>/g, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 3000));
          console.log('FRIDAY-QUIZ links:', [...new Set([...fq.matchAll(/href="([^"#]+)"/g)].map((m) => m[1]))].filter((l) => /quiz|answer|friday/i.test(l)).join('\n'));
          JS
          node inspect.mjs
