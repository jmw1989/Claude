<title>Majors Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a scorecard in a back pocket; sticky green bar with back button, live strip and tabs. */
:root{
  --bg:#eef3ef; --card:#ffffff; --ink:#13241a; --muted:#5a6d61; --line:#d3ded6;
  --green:#1d6a3d; --on-green:#ffffff; --green-soft:#dcebe1;
  --v5:#cfe5d6; --v5-ink:#1d4a2e; --v10:#1d6a3d; --v10-ink:#ffffff; --v20:#d4a024; --v20-ink:#2a1e00;
  --pos:#1d7a43; --neg:#b23a2b; --carry:#8a6a12;
  --mk-masters:#1d6a3d; --mk-summer:#d4a024; --mk-skins:#b2482b; --mk-newyear:#2f437e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1510; --card:#16211a; --ink:#e4eee7; --muted:#92a69a; --line:#2a3b30;
  --green:#4cb276; --on-green:#07120b; --green-soft:#1d3326;
  --v5:#24402e; --v5-ink:#bfe3cb; --v10:#4cb276; --v10-ink:#07120b; --v20:#e2b443; --v20-ink:#241a00;
  --pos:#5cc98a; --neg:#ef7c6c; --carry:#e2b443;
  --mk-masters:#4cb276; --mk-summer:#e2b443; --mk-skins:#e5795b; --mk-newyear:#8ea4e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1510; --card:#16211a; --ink:#e4eee7; --muted:#92a69a; --line:#2a3b30;
  --green:#4cb276; --on-green:#07120b; --green-soft:#1d3326;
  --v5:#24402e; --v5-ink:#bfe3cb; --v10:#4cb276; --v10-ink:#07120b; --v20:#e2b443; --v20-ink:#241a00;
  --pos:#5cc98a; --neg:#ef7c6c; --carry:#e2b443;
  --mk-masters:#4cb276; --mk-summer:#e2b443; --mk-skins:#e5795b; --mk-newyear:#8ea4e8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--v20);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--on-green);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top.hastabs{padding-bottom:0}
.bar{display:flex;align-items:center;gap:10px;min-width:0}
.back{background:rgba(255,255,255,.14);border:0;color:var(--on-green);border-radius:8px;width:36px;height:36px;font-size:22px;line-height:1;flex:none}
.ttl{min-width:0;flex:1}
.ttl h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pm{background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;min-width:0}
.pm .n{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.pm .s{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--on-green);opacity:.75;padding:10px 0 9px;
  font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--v20)}

.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.note.warn{color:var(--neg)}
section{margin-top:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px;text-wrap:balance}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}

/* Home */
.yearbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.yearbar .yr{font-family:var(--display);font-weight:700;font-size:30px}
.yearbar button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
.majors{display:grid;gap:12px;margin-top:12px}
.mcard{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 0;overflow:hidden}
.mcard .flag{align-self:stretch;margin:-14px 0;background:var(--mk)}
.mcard .when{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mcard .mn{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;text-transform:uppercase}
.mcard .ms{font-size:14px;color:var(--muted);margin-top:2px}
.mcard .ms b{color:var(--ink)}
.mcard .go{font-size:22px;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.links button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.links .lt{font-weight:600}
.links .ls{font-size:13px;color:var(--muted)}

/* Hole view */
.holehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.holehead .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:.9}
.holehead .big small{font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:16px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.val5{background:var(--v5);color:var(--v5-ink);border-color:transparent}
.val10,.prize{background:var(--v10);color:var(--v10-ink);border-color:transparent}
.val20{background:var(--v20);color:var(--v20-ink);border-color:transparent}
.pot{margin:12px 0 4px;font-size:15px;color:var(--muted)}
.pot b{font-family:var(--display);font-size:22px;color:var(--ink)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname{font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo{font-size:13px;color:var(--muted)}
.pinfo b{color:var(--ink)}
.pu{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;font-weight:600;padding:1px 6px;margin-left:4px}
.pu[aria-pressed="true"]{background:var(--neg);color:var(--card);border-color:transparent}
.dots{color:var(--green);letter-spacing:2px;font-size:14px}
.dots.minus{color:var(--neg)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:26px;font-weight:600;line-height:1}
.stepper button:active{transform:scale(.96)}
.gross{width:52px;text-align:center}
.gross .g{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.gross .nt{font-size:12px;color:var(--muted)}
.prow.best .gross .g{color:var(--pos)}
.result{margin-top:12px;border-radius:10px;padding:12px 14px;font-weight:600;text-align:center}
.result.won{background:var(--green);color:var(--on-green)}
.result.carry{background:var(--v20);color:var(--v20-ink)}
.result.pending{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.navrow{display:flex;gap:10px;margin-top:14px}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--card);padding:12px 14px;font-weight:600;flex:1}
.btn.primary{background:var(--green);color:var(--on-green);border-color:transparent}
.btn.danger{color:var(--neg)}
.btn.small{flex:none;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:16px}
.hb{border-radius:8px;border:1px solid var(--line);background:var(--card);padding:4px 0 3px;text-align:center;min-width:0}
.hb .hn{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1}
.hb .hs{font-size:11px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden}
.hb.v5{box-shadow:inset 0 -4px 0 var(--v5)}
.hb.v10,.hb.pz{box-shadow:inset 0 -4px 0 var(--v10)}
.hb.v20{box-shadow:inset 0 -4px 0 var(--v20)}
.hb.cur{outline:2px solid var(--ink);outline-offset:-1px}
.hb .hs.w{color:var(--pos);font-weight:600}
.hb .hs.c{color:var(--carry);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--sw)}

/* Prize ranking */
.prizebox{margin-top:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:12px}
.prizebox .pt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prizebox .ptt{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.rank{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.rank button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;display:grid;gap:2px;justify-items:center;min-width:0}
.rank button .rn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rank button .rp{font-size:12px;color:var(--muted)}
.rank button.on{background:var(--green);color:var(--on-green);border-color:transparent}
.rank button.on .rp{color:var(--on-green);opacity:.9}

/* Tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.l,th.l{text-align:left}
td.win{color:var(--pos);font-weight:700}
td .sup{font-size:10px;color:var(--muted);vertical-align:super}
tr.tot td{font-weight:700;border-bottom:0}
td.big{font-family:var(--display);font-weight:700;font-size:20px}

.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ledger .row:first-child{border-top:0}
.ledger .amt{font-family:var(--display);font-weight:700;font-size:26px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.rlist{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rcard .rt{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
.rcard .rs{font-size:13px;color:var(--muted)}
.state{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line)}
.state.done{background:var(--green);color:var(--on-green);border-color:transparent}
.state.live{background:var(--v20);color:var(--v20-ink);border-color:transparent}

/* Forms */
.field{display:grid;gap:4px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
input[type=text],input[type=number],input[type=date],select{width:100%;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px;align-items:end}
.stack{display:grid;gap:12px}
.players .pl{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.players .pl:first-child{border-top:0;padding-top:0}
.calc{font-size:13px;color:var(--muted)}
.calc b{color:var(--ink)}
.tees td input{padding:6px 6px;text-align:center}
.tees td.l input{text-align:left}
.hcfg td input,.hcfg td select{padding:6px 4px;text-align:center}
.opts{display:grid;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--bg);flex:1 1 140px;cursor:pointer}
.seg input{accent-color:var(--green)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.confirm{margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--neg)}
.example{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--v20);color:var(--v20-ink);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{text-align:center;padding:24px 14px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.stepper button{width:42px;height:42px}.holehead .big{font-size:46px}.mcard .mn{font-size:24px}}
</style>

<div class="wrap">
  <header class="top" id="top">
    <div class="bar"><button class="back" id="back" aria-label="Back" hidden>‹</button><div class="ttl"><h1 id="h1">Majors Tour</h1><div class="sub" id="sub"></div></div></div>
    <div class="strip" id="strip" hidden></div>
    <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  </header>
  <p class="note" id="syncnote">Connecting…</p>
  <main id="main"></main>
</div>

<script>
(function(){
const N = 3, H = 18, LS = "majors-tour-v1", OLD_LS = "skins-major-v1", LEGACY_YEAR = 2026;
const PRIZE = {1:[2], 2:[2,1], 3:[3,2,1]};
const MAJORS = [
  {key:"masters", name:"The Masters", kind:"stable", rounds:4, when:"Abroad", blurb:"Four rounds, stableford and prizes"},
  {key:"summer", name:"Summer Series", kind:"stable", rounds:4, when:"UK summer", blurb:"Same format, played in the UK"},
  {key:"skins", name:"Skins Major", kind:"skins", when:"One round", blurb:"18-hole skins for £5, £10 and £20"},
  {key:"newyear", name:"New Year Major", kind:"stable", rounds:1, when:"31 December", blurb:"One round, stableford and prizes"}
];
const DEFAULT_ROSTER = {players:[{name:"Jonty", hi:12.4},{name:"Brandy", hi:18.0},{name:"Pete", hi:8.6}], example:true};
const SKINS_HOLES = [[4,7,5],[3,15,5],[5,1,5],[4,11,5],[4,3,5],[4,9,5],[3,17,10],[5,5,10],[4,13,20],
  [4,8,10],[4,2,10],[3,16,10],[5,6,10],[4,10,10],[4,12,10],[3,18,10],[5,4,20],[4,14,20]];

/* ---------- Utilities ---------- */
function clone(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }
function isObj(v){ return v && typeof v === "object" && !Array.isArray(v); }
function deepMerge(t, s){ for (const k in s){ if (isObj(s[k]) && isObj(t[k])) deepMerge(t[k], s[k]); else t[k] = clone(s[k]); } return t; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }
function sum(a){ return a.reduce((x,y)=>x+(+y||0),0); }
function pts(v){ return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function money(v, sign){ const a = Math.abs(v); const s = "£" + (Number.isInteger(Math.round(a*100)/100) ? Math.round(a) : a.toFixed(2));
  if (!sign) return s; if (a < 0.005) return "£0"; return (v > 0 ? "+" : "−") + s; }
function ord(n){ return ["1st","2nd","3rd"][n] || (n+1)+"th"; }
function names(idx){ return idx.map(i => esc(roster().players[i].name)).join(" & "); }
function fmtDate(d){ if (!d) return ""; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("en-GB", {day:"numeric", month:"short"}); }
const $ = id => document.getElementById(id);

/* ---------- Store: shared db when available, this device otherwise ---------- */
let docs = {}, mode = "starting", readOnly = false, db = null;
const serverExists = new Set(), queues = {};
let local = {docs:{}, ui:{}};
try { local = Object.assign(local, JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e){}
docs = local.docs || {};
try { // bring over a round saved by the earlier skins-only version
  const old = JSON.parse(localStorage.getItem(OLD_LS) || "null");
  if (old && old.setup && !docs["round/setup"]){ docs["round/setup"] = old.setup; docs["round/scores"] = old.scores || {}; }
} catch(e){}
function persist(){ try { localStorage.setItem(LS, JSON.stringify({docs, ui})); } catch(e){} }

function enqueue(path, fn){ queues[path] = (queues[path] || Promise.resolve()).then(fn).catch(handleWriteError); }
function write(path, patch){
  docs[path] = deepMerge(docs[path] ? clone(docs[path]) : {}, patch);
  persist(); render();
  if (mode !== "shared") return;
  enqueue(path, async () => {
    const ref = db.doc(path);
    if (serverExists.has(path)) await ref.update(clone(patch));
    else { await ref.set(clone(docs[path])); serverExists.add(path); }
  });
}
function replace(path, data){
  docs[path] = clone(data); persist(); render();
  if (mode !== "shared") return;
  enqueue(path, async () => { await db.doc(path).set(clone(data)); serverExists.add(path); });
}
function removeDoc(path){
  delete docs[path]; persist(); render();
  if (mode !== "shared") return;
  enqueue(path, async () => { await db.doc(path).delete(); serverExists.delete(path); });
}
function handleWriteError(e){
  if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")){ readOnly = true; render(); }
  else { const n = $("syncnote"); n.className = "note warn"; n.textContent = "Couldn't save that change. Check your signal and try again."; }
}

/* ---------- UI state ---------- */
let ui = Object.assign({view:"home", year:new Date().getFullYear(), major:null, round:1, sub:"hole", cur:{}, courseId:null, back:null}, local.ui || {});
const HASHES = {masters:1, summer:1, skins:1, newyear:1, courses:1, players:1};
const h0 = (location.hash || "").replace("#","");
if (HASHES[h0]){ if (h0 === "courses" || h0 === "players") ui.view = h0; else { ui.major = h0; ui.view = h0 === "skins" ? "skins" : "major"; } }
let form = null, confirm = null;
function go(patch){ Object.assign(ui, patch); form = null; confirm = null; persist(); render(); window.scrollTo(0,0); }
function curHole(){ const k = ctxKey(); return ui.cur[k] || 1; }
function setHole(h){ ui.cur[ctxKey()] = h; persist(); render(); }
function ctxKey(){ return ui.view === "skins" ? `${ui.year}-skins` : `${ui.year}-${ui.major}-r${ui.round}`; }
function formFor(id, init){ if (!form || form.id !== id || !form.dirty) form = {id, data:init(), dirty:false}; return form.data; }

/* ---------- Data accessors ---------- */
function roster(){ const r = docs["config/roster"]; return r && Array.isArray(r.players) ? r : DEFAULT_ROSTER; }
function courses(){ return Object.keys(docs).filter(p => p.startsWith("courses/")).map(p => Object.assign({id:p.slice(8)}, docs[p])).sort((a,b) => String(a.name).localeCompare(b.name)); }
function majorDef(key){ return MAJORS.find(m => m.key === key); }
function majorPath(key, year){ return `majors/${year || ui.year}-${key}`; }
function getMajor(key, year){
  const def = majorDef(key), d = docs[majorPath(key, year)] || {};

function skinsPaths(){ return ui.year === LEGACY_YEAR ? {setup:"round/setup", scores:"round/scores"} : {setup:`skins-${ui.year}/setup`, scores:`skins-${ui.year}/scores`}; }
function skinsDefault(){

/* ---------- Handicaps ---------- */
function courseHcp(hi, tee){
  const t = tee || {}; const slope = Number(t.slope) || 113, rating = Number(t.rating), par = Number(t.par);
  return Math.round((parseFloat(hi) || 0) * slope / 113 + ((isNaN(rating) || isNaN(par) || !t.rating) ? 0 : rating - par));
}
function strokesOn(hcp, si){
  if (hcp >= 0) return Math.floor(hcp/18) + (si <= hcp % 18 ? 1 : 0);
  const a = -hcp; return -(Math.floor(a/18) + (si > 18 - (a % 18) ? 1 : 0));
}
function sisOk(holes){ return holes.map(h => +h.si).sort((a,b)=>a-b).join(",") === range(1,18).join(","); }

/* ---------- Stableford majors ---------- */
function roundCalc(major, rn){
  const round = major.rounds["r"+rn];
  if (!round || !round.course) return null;
  const c = round.course, R = roster().players;
  const players = R.map((p,i) => {
    const tee = c.tees[(round.tees || [])[i] || 0] || c.tees[0];
    const hi = (round.hi || [])[i] ?? p.hi;
    const ch = courseHcp(hi, tee), ph = Math.round(ch * (Number(major.allowance) || 100) / 100);
    const holes = c.holes.map((h, k) => {
      const st = strokesOn(ph, Number(h.si));
      const raw = round.scores && round.scores["p"+i] && round.scores["p"+i]["h"+(k+1)];
      const gross = typeof raw === "number" ? raw : null;
      const p_ = gross == null ? null : gross === 0 ? 0 : Math.max(0, Number(h.par) + 2 - (gross - st));
      return {gross, st, pts:p_};
    });
    const total = sum(holes.map(x => x.pts || 0)), thru = holes.filter(x => x.gross != null).length;
    return {hi, tee, ch, ph, holes, total, thru};
  });
  const complete = players.every(p => p.thru === H);
  const win = Array(N).fill(0), ctp = Array(N).fill(0), ld = Array(N).fill(0);
  const best = Math.max(...players.map(p => p.total));
  let leaders = players.map((p,i) => p.total === best ? i : -1).filter(i => i >= 0);
  let tiers = null;
  if (complete){
    tiers = placeTiers(players, major.tieRule === "countback");
    const pts_ = PLACE_PTS[tiers.map(t => t.length).join(",")] || [];
    tiers.forEach((t,k) => t.forEach(i => win[i] = pts_[k]));
    leaders = tiers[0];
  }
  const par3s = c.holes.map((h,k) => +h.par === 3 ? k+1 : 0).filter(Boolean);
  par3s.forEach(h => prizePts((round.ctp || {})["h"+h]).forEach((v,i) => ctp[i] += v));
  if (round.ldHole) prizePts(round.ld).forEach((v,i) => ld[i] += v);
  const total = players.map((p,i) => win[i] + ctp[i] + ld[i]);
  return {round, course:c, players, complete, leaders, tiers, win, ctp, ld, total, par3s, started: players.some(p => p.thru > 0)};
}
/* Stableford places: 5, 3, 1. Tied players get the higher place's points; a tie for first leaves third on 2. */
const PLACE_PTS = {"1,1,1":[5,3,1], "2,1":[5,2], "1,2":[5,3], "3":[5]};
function placeTiers(players, countback){
  // key per player: total, then (with countback) back 9, back 6, back 3, 18th
  const key = i => { const h = players[i].holes.map(x => x.pts || 0);
    return countback ? [sum(h), sum(h.slice(9)), sum(h.slice(12)), sum(h.slice(15)), h[17]] : [sum(h)]; };
  const ks = range(0,N-1).map(key);
  const cmp = (a,b) => { for (let k = 0; k < ks[a].length; k++) if (ks[a][k] !== ks[b][k]) return ks[b][k] - ks[a][k]; return 0; };
  const order = range(0,N-1).sort(cmp), tiers = [];
  order.forEach(i => { const last = tiers[tiers.length-1]; if (last && cmp(last[0], i) === 0) last.push(i); else tiers.push([i]); });
  return tiers;
}
function prizePts(order){
  const out = Array(N).fill(0); const o = (order || []).filter(i => i >= 0 && i < N);
  const table = PRIZE[o.length] || [];
  o.forEach((p,k) => out[p] += table[k] || 0);
  return out;
}
function majorCalc(key, year){
  const m = getMajor(key, year); const rounds = [];
  for (let r = 1; r <= m.roundsCount; r++) rounds.push(roundCalc(m, r));
  const tot = {win:Array(N).fill(0), ctp:Array(N).fill(0), ld:Array(N).fill(0), total:Array(N).fill(0), stab:Array(N).fill(0), roundWins:Array(N).fill(0)};
  rounds.forEach(rc => { if (!rc) return; for (let i = 0; i < N; i++){ tot.win[i] += rc.win[i]; tot.ctp[i] += rc.ctp[i]; tot.ld[i] += rc.ld[i]; tot.total[i] += rc.total[i]; tot.stab[i] += rc.players[i].total; if (rc.win[i]) tot.roundWins[i]++; } });
  const done = rounds.filter(r => r && r.complete).length, started = rounds.filter(r => r && r.started).length;
  return {m, rounds, tot, done, started};
}

/* ---------- Skins ---------- */
function skinsHcps(s){
  const rows = s.players.map(p => {
    const t = s.tees[p.tee] || s.tees[0];
    const ch = courseHcp(p.hi, t);
    return {ch, ph: Math.round(ch * (Number(s.allowance)||100) / 100)};
  });
  const low = Math.min(...rows.map(r => r.ph));
  rows.forEach(r => r.strokes = s.strokeMode === "low" ? r.ph - low : r.ph);
  return rows;
}
function skinsCalc(S){
  const {setup, scores} = S, hc = skinsHcps(setup);
  const get = (p,h) => { const v = scores["p"+p] && scores["p"+p]["h"+h]; return typeof v === "number" && v > 0 ? v : null; };
  const res = [], won = Array(N).fill(0), skins = Array(N).fill(0);
  let carry = 0, blocked = false, allDone = true;
  const onTee = setup.valueMode === "tee", picked = scores.values || {};
  const valueOf = h => onTee ? (+picked["h"+h] || null) : Number(setup.holes[h-1].value);
  for (let h = 1; h <= H; h++){
    const hole = setup.holes[h-1], value = valueOf(h);
    const st = hc.map(r => strokesOn(r.strokes, Number(hole.si)));
    const g = range(0,N-1).map(p => get(p,h));
    const nets = g.map((x,i) => x == null ? null : x - st[i]);
    if (blocked || value == null || g.some(x => x == null)){
      res.push({h, status: blocked ? "blocked" : "pending", pot: blocked || value == null ? null : carry + value, carryIn: blocked ? null : carry, value, st, nets, g});
      blocked = true; allDone = false; continue;
    }
    const pot = carry + value, min = Math.min(...nets);
    const best = nets.map((n,i) => n === min ? i : -1).filter(i => i >= 0);
    if (best.length === 1){ won[best[0]] += pot; skins[best[0]]++; res.push({h, status:"won", winner:best[0], pot, carryIn:carry, value, st, nets, g}); carry = 0; }
    else { res.push({h, status:"carry", tied:best, pot, carryIn:carry, value, st, nets, g}); carry = pot; }
  }
  let leftover = 0, endNote = "";
  const pn = i => esc(setup.players[i].name);
  if (allDone && carry > 0){
    const last = res[H-1];
    if (setup.endTie === "split"){ last.tied.forEach(i => won[i] += carry / last.tied.length); endNote = `£${carry} carried past 18, split between ${last.tied.map(pn).join(" & ")}.`; }
    else if (setup.playoffWinner != null){ won[setup.playoffWinner] += carry; skins[setup.playoffWinner]++; endNote = `${pn(setup.playoffWinner)} won the £${carry} playoff.`; }
    else { leftover = carry; endNote = `£${carry} is still up for grabs. Play it off, then pick the winner on the Money tab.`; }
  }
  const total = sum(won);
  // "each": both opponents pay the winner. "pot": everyone staked an equal share of the money awarded.
  const net = setup.moneyMode === "each" ? won.map(w => w*N - total) : won.map(w => w - total/N);
  // What's left of the 6 × £5, 9 × £10, 3 × £20 allowance when values are picked on the tee
  const left = {5:6, 10:9, 20:3};
  if (onTee) Object.values(picked).forEach(v => { if (left[v] != null) left[v]--; });
  return {hc, res, won, skins, carry, allDone, leftover, endNote, net, total, get, onTee, left, valueOf,
    started: res.some(r => r.g && r.g.some(x => x != null)) || (onTee && Object.values(picked).some(Boolean))};
}
function settle(net){
  const cr = [], dr = [];
  net.forEach((v,i) => { if (v > 0.004) cr.push({i, v}); else if (v < -0.004) dr.push({i, v:-v}); });
  const out = [];
  while (cr.length && dr.length){
    const c = cr[0], d = dr[0], amt = Math.min(c.v, d.v);
    out.push({from:d.i, to:c.i, amt}); c.v -= amt; d.v -= amt;
    if (c.v < 0.004) cr.shift(); if (d.v < 0.004) dr.shift();
  }
  return out;
}

const GCA = "https://api.golfcourseapi.com/v1", OGA = "https://api.opengolfapi.org/v1";

function integrations(){ return docs["config/integrations"] || {}; }
function num(v){ const n = parseFloat(v); return isNaN(n) ? "" : n; }
function pick(o, keys){ for (const k of keys) if (o && o[k] != null && o[k] !== "") return o[k]; return undefined; }
function listOf(j, keys){ if (Array.isArray(j)) return j; for (const k of keys) if (j && Array.isArray(j[k])) return j[k]; return []; }
async function getJSON(url, headers){

  if (r.status === 401 || r.status === 403) throw new Error("The course search key was refused. Check it on the Courses page, or clear it to use the free search.");
  if (r.status === 429) throw new Error("The course search has hit its daily limit. Try again tomorrow, or enter the course by hand.");
  if (!r.ok) throw new Error("The course database didn't answer (error " + r.status + "). Try again, or enter the course by hand.");
  return r.json();
}
async function searchCourses(q){
  const key = integrations().golfCourseApiKey;
  if (key){
    const j = await getJSON(`${GCA}/search?search_query=${encodeURIComponent(q)}`, {Authorization: "Key " + key});
    return listOf(j, ["courses","results","data"]).map(c => ({src:"gca", id:c.id,
      name: [c.club_name, c.course_name].filter((x,i,a) => x && a.indexOf(x) === i).join(" – ") || "Course",
      place: [pick(c.location, ["city"]), pick(c.location, ["state"]), pick(c.location, ["country"])].filter(Boolean).join(", ")}));
  }
  const j = await getJSON(`${OGA}/courses/search?q=${encodeURIComponent(q)}&limit=25`);
  return listOf(j, ["courses","results","data","items"]).map(c => ({src:"oga", id: pick(c, ["id","course_id","slug"]),
    name: [pick(c, ["club_name","club"]), pick(c, ["name","course_name"])].filter((x,i,a) => x && a.indexOf(x) === i).join(" – ") || "Course",
    place: [pick(c, ["city","town"]) || pick(c.location, ["city"]), pick(c, ["state","region"]) || pick(c.location, ["state"]), pick(c, ["country"]) || pick(c.location, ["country"])].filter(Boolean).join(", ")}));
}
async function loadCourse(hit){
  if (hit.src === "gca"){
    const j = await getJSON(`${GCA}/courses/${encodeURIComponent(hit.id)}`, {Authorization: "Key " + integrations().golfCourseApiKey});
    return Object.assign(normaliseCourse(j.course || j, null, null, hit), {raw: j});
  }
  const base = `${OGA}/courses/${encodeURIComponent(hit.id)}`;
  const [c, tees, holes] = await Promise.all([getJSON(base), getJSON(base + "/tees").catch(() => null), getJSON(base + "/holes").catch(() => null)]);
  return Object.assign(normaliseCourse(c.course || c, tees, holes, hit), {raw: {course: c, tees, holes}});
}
// Turn either database's answer into the app's course shape: tees with rating/slope/par, 18 holes with par and SI.
function normaliseCourse(c, teesExtra, holesExtra, hit){
  const groups = [];
  const addGroup = (src, label) => {
    if (!src) return;
    if (Array.isArray(src)) groups.push([src, label]);
    else { if (Array.isArray(src.male) || Array.isArray(src.men)) groups.push([src.male || src.men, ""]);
      if (Array.isArray(src.female) || Array.isArray(src.women)) groups.push([src.female || src.women, " (ladies)"]);
      if (Array.isArray(src.tees)) addGroup(src.tees, label); }
  };
  addGroup(c.tees, ""); if (!groups.length) addGroup(teesExtra, "");
  const tees = [], teeHoles = [];
  groups.forEach(([list, label]) => list.forEach(t => {
    const holes = listOf(t.holes || t.scorecard, ["holes"]);
    const par = num(pick(t, ["par_total","total_par","par"])) || (holes.length ? sum(holes.map(h => +pick(h, ["par"]) || 0)) : "");
    const g = (pick(t, ["gender","sex"]) || "").toString().toLowerCase();
    const lab = label || (g.startsWith("f") || g.startsWith("w") || g === "ladies" ? " (ladies)" : "");
    tees.push({name: String(pick(t, ["tee_name","name","tee","color","colour"]) || "Tees") + lab,
      rating: num(pick(t, ["course_rating","courseRating","rating"])), slope: num(pick(t, ["slope_rating","slopeRating","slope"])), par: par || 72});
    teeHoles.push(holes);
  }));
  let holes = teeHoles.find(h => h.length >= 18 && h.every(x => pick(x, ["par"]) != null)) || [];
  if (holes.length < 18){ // OpenGolfAPI: /holes gives {holes: [...]}, the course itself carries "scorecard"
    const options = [listOf(holesExtra, ["holes","data"]), listOf(c.scorecard, ["holes"]), listOf(c.holes, ["holes"])];
    const hx = options.find(o => o.length >= 18); if (hx) holes = hx.slice().sort((a,b) => (+a.hole_number || 0) - (+b.hole_number || 0)); }
  const notes = [];
  let out = range(1,18).map(n => ({par:4, si:""}));
  if (holes.length >= 18){
    out = holes.slice(0,18).map((h,k) => ({par: +pick(h, ["par"]) || 4, si: +pick(h, ["handicap","stroke_index","strokeIndex","si","hcp","handicap_index"]) || 0}));
    // Some databases fill unknown stroke indexes with the hole number; no real course runs 1–18 in hole order
    if (out.every((h,k) => h.si === k+1)) out.forEach(h => { h.si = ""; });
    if (!sisOk(out)){ notes.push("The database doesn't have this course's stroke indexes, so enter them from the scorecard (the boxes are left blank)."); out.forEach(h => { if (!h.si) h.si = ""; }); }
  } else notes.push("Hole pars and stroke indexes weren't available, so enter them from the scorecard.");
  if (!tees.length){ notes.push("No tee ratings were found, so add rating and slope from the scorecard."); tees.push({name:"Yellow", rating:"", slope:"", par:sum(out.map(h => h.par))}); }
  else if (tees.some(t => t.rating === "" || t.slope === "")) notes.push("Some tees have no rating or slope. Leave them blank to use handicaps as they are, or fill them in.");
  const country = pick(c.location, ["country"]) || pick(c, ["country"]) || (hit.place || "").split(", ").pop() || "";
  return {data:{name: hit.name, country, tees, holes: out}, notes};
}

function skinsHoleView(S, C){
  const setup = S.setup, cur = curHole(), hole = setup.holes[cur-1], r = C.res[cur-1];
  const pot = r.status === "blocked" ? `Finish earlier holes to see what this hole is worth.`
    : r.value == null ? `Pick what this hole is worth${r.carryIn ? `. £${r.carryIn} is carrying over` : ""}.`
    : `Playing for <b class="num">£${r.pot}</b>${r.carryIn ? ` (£${r.value} + £${r.carryIn} carried)` : ""}`;
  const picker = C.onTee ? `<div class="prizebox"><div class="pt"><div class="ptt">Hole value</div><div class="pinfo num">Left: ${C.left[5]} × £5 · ${C.left[10]} × £10 · ${C.left[20]} × £20</div></div>
    <div class="rank">${[5,10,20].map(v => { const on = r.value === v, out = !on && C.left[v] <= 0;
      return `<button class="${on ? "on" : ""}" data-value="${v}" ${readOnly || out ? "disabled" : ""} aria-pressed="${on}"><span class="rn">£${v}</span><span class="rp">${on ? "Chosen" : out ? "None left" : C.left[v] + " left"}</span></button>`; }).join("")}</div></div>` : "";
  const known = r.nets.filter(x => x != null), min = known.length === N ? Math.min(...known) : null;
  const rows = setup.players.map((p,i) => {
    const g = C.get(i, cur), s = r.st[i];
    const info = `${s > 0 ? `Gets ${s} shot${s>1?"s":""}` : s < 0 ? `Gives ${-s}` : "No shot"}${g != null ? ` · net ${g - s}` : ""}`;
    return stepperRow(p.name, i, g, s, info, min != null && r.nets[i] === min, false);
  }).join("");
  let res;
  if (r.status === "won") res = `<div class="result won">${esc(setup.players[r.winner].name)} wins the skin · £${r.pot}</div>`;
  else if (r.status === "carry") res = cur === H ? `<div class="result carry">Tied on 18 · £${r.pot} ${setup.endTie === "split" ? "split between the tied players" : "goes to a playoff"}</div>`

  const strip = C.res.map(x => {

  }).join("");
  return `<section class="card">
    <div class="holehead"><div class="big num"><small>Hole</small>${cur}</div>
      <div class="meta"><span class="chip">Par ${hole.par}</span><span class="chip">SI ${hole.si}</span>${r.value != null ? `<span class="chip val${r.value}">£${r.value}</span>` : ""}</div></div>
    <p class="pot">${pot}</p>${picker}${rows}${res}
    <div class="navrow"><button class="btn" data-go="${cur-1}" ${cur===1?"disabled":""}>‹ Hole ${Math.max(1,cur-1)}</button>
      <button class="btn primary" data-go="${cur+1}" ${cur===H?"disabled":""}>Hole ${Math.min(H,cur+1)} ›</button></div>
  </section>
  <div class="holes">${strip}</div>
  <div class="legend"><span style="--sw:var(--v5)">£5 hole</span><span style="--sw:var(--v10)">£10 hole</span><span style="--sw:var(--v20)">£20 hole</span></div>

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const ds = t.dataset;
  if (t.id === "back"){
    if (ui.view === "round") go({view:"major"});
    else if (ui.view === "course") go(ui.back ? Object.assign({}, ui.back, {back:null}) : {view:"courses"});
    else go({view:"home"});
    return;
  }
  if (ds.year){ go({year: ui.year + (+ds.year)}); return; }
  if (ds.major){ const def = majorDef(ds.major); go(def.kind === "skins" ? {view:"skins", major:"skins", sub: skinsState().saved ? "hole" : "setup"} : {view:"major", major:ds.major}); return; }
  if (ds.view){ go({view:ds.view}); return; }
  if (ds.course){ go({view:"course", courseId:ds.course, back:null}); return; }
  if (ds.round){ const has = getMajor(ui.major).rounds["r"+ds.round]; go({view:"round", round:+ds.round, sub: has ? "hole" : "setup"}); return; }
  if (ds.sub){ go({sub:ds.sub}); return; }
  if (ds.go){ const h = +ds.go; if (h >= 1 && h <= H) setHole(h); return; }
  if (ds.step && !readOnly){ stepScore(+ds.p, +ds.step); return; }
  if (ds.pu && !readOnly){ const p = +ds.pu, cur = curHole(), g = currentGross(p, cur); writeGross(p, cur, g === 0 ? null : 0); return; }
  if (ds.value && !readOnly){ const h = curHole(), cur = skinsState().scores.values || {};
    write(skinsPaths().scores, {values: {["h"+h]: +cur["h"+h] === +ds.value ? null : +ds.value}}); return; }
  if (ds.prize && !readOnly){ togglePrize(ds.prize, +ds.hole, +ds.p); return; }
  if (ds.playoff && !readOnly){ const p = skinsPaths(), s = skinsState().setup; s.playoffWinner = ds.playoff === "none" ? null : +ds.playoff; replace(p.setup, s); return; }
  if (ds.act) action(ds.act, t);
});
function currentGross(p, h){
  if (ui.view === "skins"){ const v = skinsState().scores["p"+p]?.["h"+h]; return typeof v === "number" ? v : null; }
  const r = getMajor(ui.major).rounds["r"+ui.round]; const v = r && r.scores && r.scores["p"+p] && r.scores["p"+p]["h"+h]; return typeof v === "number" ? v : null;
}
function stepScore(p, dir){
  const cur = curHole();
  const par = ui.view === "skins" ? +skinsState().setup.holes[cur-1].par : +getMajor(ui.major).rounds["r"+ui.round].course.holes[cur-1].par;
  const g = currentGross(p, cur);
  let v = (g == null || g === 0) ? (dir > 0 ? par : par - 1) : g + dir;
  writeGross(p, cur, Math.max(1, Math.min(15, v)));
}
function writeGross(p, h, v){
  if (ui.view === "skins") write(skinsPaths().scores, {["p"+p]: {["h"+h]: v}});
  else write(majorPath(ui.major), {rounds: {["r"+ui.round]: {scores: {["p"+p]: {["h"+h]: v}}}}});
}
function togglePrize(kind, hole, p){
  const r = getMajor(ui.major).rounds["r"+ui.round];
  const cur = kind === "ctp" ? ((r.ctp || {})["h"+hole] || []) : (r.ld || []);
  const next = cur.includes(p) ? cur.filter(x => x !== p) : cur.concat(p).slice(0, N);
  const patch = kind === "ctp" ? {ctp: {["h"+hole]: next}} : {ld: next};
  write(majorPath(ui.major), {rounds: {["r"+ui.round]: patch}});
}
function slug(s){ return (String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "course") + "-" + Math.random().toString(36).slice(2, 7); }
function action(a, t){
  if (a === "cancel"){ confirm = null; renderMain(); return; }
  if (readOnly) return;
  if (a === "save-players"){ const d = clone(form.data); d.example = false; form.dirty = false; replace("config/roster", d); return; }
  if (a === "new-course"){ finder = {q:"", loading:false, results:null, error:"", note:""}; go({view:"course", courseId:null, back:null}); return; }
  if (a === "save-key"){ const v = ($("gcakey").value || "").trim(); replace("config/integrations", Object.assign({}, integrations(), {golfCourseApiKey: v})); return; }
  if (a === "course-search"){
    const q = ($("csq").value || "").trim(); if (q.length < 3){ $("csq").focus(); return; }
    finder = {q, loading:true, results:null, error:"", note:""}; renderMain();
    searchCourses(q).then(r => { finder.results = r; }).catch(e => { finder.error = e.message; }).finally(() => { finder.loading = false; if (ui.view === "course") renderMain(); });
    return;
  }
  if (a === "course-pick"){
    const hit = finder.results[+t.dataset.i]; finder.loading = true; renderMain();
    loadCourse(hit).then(({data, notes, raw}) => {
      form = {id: "course:new", data, dirty: true};
      finder = {q: finder.q, loading:false, results:null, error:"", raw: JSON.stringify(raw, null, 1).slice(0, 4000), note: `Imported <b>${esc(data.name)}</b> with ${data.tees.length} set${data.tees.length===1?"":"s"} of tees. ${notes.map(esc).join(" ")} Check the details, then tap Save course.`};
    }).catch(e => { finder.loading = false; finder.error = e.message; }).finally(() => { if (ui.view === "course") renderMain(); });
    return;
  }
  if (a === "new-course-from-round"){ finder = {q:"", loading:false, results:null, error:"", note:""}; go({view:"course", courseId:null, back:{view:"round", sub:"setup"}}); return; }
  if (a === "add-tee"){ form.data.tees.push({name:"", rating:"", slope:"", par: form.data.tees[0] ? form.data.tees[0].par : 72}); form.dirty = true; renderMain(); return; }
  if (a === "del-tee"){ form.data.tees.splice(+t.dataset.k, 1); form.dirty = true; renderMain(); return; }
  if (a === "save-course"){
    const d = clone(form.data);
    if (!String(d.name).trim()){ const n = $("cn"); if (n){ n.focus(); n.placeholder = "Give the course a name"; } return; }
    if (!sisOk(d.holes)){ renderMain(); const w = $("siwarn"); if (w) w.scrollIntoView({block:"center"}); const empty = d.holes.findIndex(h => !h.si); const el = $("cs" + (empty + 1)); if (el && empty >= 0) el.focus(); return; }
    const id = ui.courseId || slug(d.name);
    form.dirty = false; replace("courses/" + id, d);
    if (ui.back) go(Object.assign({}, ui.back, {back:null})); else go({view:"courses"});
    return;
  }
  if (a === "ask-del-course"){ confirm = "del-course"; renderMain(); return; }
  if (a === "del-course"){ const id = ui.courseId; go({view:"courses", courseId:null}); removeDoc("courses/" + id); return; }
  if (a === "add-honour"){
    const y = parseInt($("hy").value, 10), n = $("hn").value.trim();
    if (!y || !n){ (!n ? $("hn") : $("hy")).focus(); return; }
    replace("config/honours", deepMerge(clone(honoursDoc()), {[ui.major]: {[y]: n}})); return;
  }
  if (a === "del-honour"){
    const all = clone(honoursDoc()); if (all[ui.major]) delete all[ui.major][t.dataset.y];
    replace("config/honours", all); return;
  }
  if (a === "save-major"){ const d = form.data; form.dirty = false; write(majorPath(ui.major), {roundsCount:+d.roundsCount, allowance:+d.allowance, tieRule:d.tieRule}); return; }
  if (a === "save-round"){
    const d = clone(form.data); if (!d.course) return;
    const saved = getMajor(ui.major).rounds["r"+ui.round] || {};
    const base = {date:d.date || "", courseId:d.courseId, course:d.course, tees:d.tees.map(Number), hi:d.hi.map(x => x === "" ? 0 : Number(x)), ldHole: d.ldHole ? +d.ldHole : null};
    // A different course or LD hole invalidates prize results tied to the old holes
    if (saved.courseId && saved.courseId !== d.courseId){ base.ctp = {}; base.ld = []; }
    if (saved.ldHole && +saved.ldHole !== +d.ldHole) base.ld = [];
    const M = getMajor(ui.major);
    form.dirty = false;
    const roundDoc = Object.assign({}, saved, base);
    if (base.ctp){ // a nested merge can't drop old prize keys, so replace the whole major doc
      const all = clone(docs[majorPath(ui.major)]); all.rounds["r"+ui.round] = roundDoc; replace(majorPath(ui.major), all);
    } else write(majorPath(ui.major), {roundsCount: M.roundsCount, allowance: M.allowance, tieRule: M.tieRule, rounds: {["r"+ui.round]: roundDoc}});
    go({sub:"hole"});
    return;
  }
  if (a === "ask-clear-round"){ confirm = "clear-round"; renderMain(); return; }
  if (a === "clear-round"){
    const all = clone(docs[majorPath(ui.major)]); const r = all.rounds["r"+ui.round];
    r.scores = {}; r.ctp = {}; r.ld = []; confirm = null; replace(majorPath(ui.major), all); return;
  }
  if (a === "save-skins"){ const d = clone(form.data); d.example = false; form.dirty = false; replace(skinsPaths().setup, d); return; }
  if (a === "ask-clear-skins"){ confirm = "clear-skins"; renderMain(); return; }
  if (a === "clear-skins"){ confirm = null; replace(skinsPaths().scores, {cleared: Date.now()}); return; }
}
const NUMERIC = ["hi","tee","rating","slope","par","si","value","allowance","roundsCount","ldHole"];
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "csq"){ e.preventDefault(); action("course-search", e.target); } });
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.actChange === "copy-course" && form){
    const c = docs["courses/" + el.value]; if (!c) return;
    const d = form.data; d.course = c.name; d.tees = clone(c.tees);
    d.holes = c.holes.map((h,k) => ({par:h.par, si:h.si, value:(d.holes[k] || {}).value || 10}));
    d.players.forEach(p => { if (p.tee >= d.tees.length) p.tee = 0; });
    form.dirty = true; renderMain(); return;
  }
  if (!el.dataset || !el.dataset.f || !form) return;
  const path = el.dataset.f.split(".");
  let o = form.data; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  const k = path[path.length-1];
  const numeric = NUMERIC.includes(k) || /^\d+$/.test(k);
  o[k] = numeric ? (el.value === "" ? "" : Number(el.value)) : el.value;
  if (k === "courseId"){ // picking a course copies it into the round
    const c = docs["courses/" + el.value];
    form.data.course = c ? clone(c) : null;
    if (c){ form.data.tees = form.data.tees.map(x => x < c.tees.length ? x : 0);
      if (form.data.ldHole && +((c.holes[form.data.ldHole-1] || {}).par) === 3) form.data.ldHole = ""; }
  }
  form.dirty = true;
  if (el.tagName === "SELECT" || el.type === "radio") renderMain();
  else liveRefresh();
});
function liveRefresh(){
  // update computed text without rebuilding the input being typed in
  if (ui.view === "skins" && form){ const hc = skinsHcps(form.data);
    document.querySelectorAll("[data-calc]").forEach(c => { const i = +c.dataset.calc; c.innerHTML = `Course handicap <b>${hc[i].ch}</b> · Playing handicap <b>${hc[i].ph}</b> · Shots in this game <b>${hc[i].strokes}</b>`; }); }
  if (ui.view === "round" && form && form.data.course){ const M = getMajor(ui.major), c = form.data.course;
    document.querySelectorAll("[data-calc]").forEach(el => { const i = +el.dataset.calc, tee = c.tees[form.data.tees[i] || 0] || c.tees[0], ch = courseHcp(form.data.hi[i], tee);
      el.innerHTML = `Course handicap <b>${ch}</b> · Playing handicap (${M.allowance}%) <b>${Math.round(ch * M.allowance / 100)}</b>`; }); }
  const b = document.querySelector('[data-act^="save-"]'); if (b) b.textContent = b.textContent.replace(/^(Saved|Setup saved)$/, "Save changes");
}

/* ---------- Boot ---------- */
render();
const subs = [];
function watchCollection(name){
  subs.push(db.collection(name).onSnapshot(qs => {
    Object.keys(docs).forEach(p => { if (p.startsWith(name + "/")) delete docs[p]; });
    qs.docs.forEach(d => { if (d.exists){ docs[name + "/" + d.id] = clone(d.data()); serverExists.add(name + "/" + d.id); } });
    persist(); renderRemote();
  }, () => {}));
}
function watchDoc(path){
  subs.push(db.doc(path).onSnapshot(s => {
    if (s.exists){ docs[path] = clone(s.data()); serverExists.add(path); } else { delete docs[path]; serverExists.delete(path); }
    persist(); renderRemote();
  }, () => {}));
}
let skinsWatched = {};
function watchSkins(){
  if (mode !== "shared") return;
  const p = skinsPaths(); if (skinsWatched[p.setup]) return;
  skinsWatched[p.setup] = 1; watchDoc(p.setup); watchDoc(p.scores);
}
(async () => {
  // On the installed app (GitHub Pages) a Firebase adapter with the same calls stands in for Claude's db
  try { db = window.majorsDb ? await window.majorsDb() : window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if (!db){ mode = "local"; render(); return; }
  mode = "shared";
  // Data shown before connecting came from this device; the shared store is the source of truth now
  docs = {}; persist();
  watchCollection("majors"); watchCollection("courses"); watchDoc("config/roster"); watchSkins();
  render();
  if (window.claude) try { const u = await window.claude.use("user"); if (u && u.can){ const c = await u.can("data.write"); if (c === false){ readOnly = true; render(); } } } catch(e){}
})();
const _go = go; go = function(p){ _go(p); watchSkins(); };
try { if (navigator.wakeLock) document.addEventListener("click", () => navigator.wakeLock.request("screen").catch(()=>{}), {once:true}); } catch(e){}
})();
</script>
